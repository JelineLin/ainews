<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日 AI 新闻简报</title>
<style>
  :root{color-scheme:light dark}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;max-width:780px;margin:0 auto;padding:24px 18px;line-height:1.7;color:#1a1a1a;background:#fafafa}
  h1{font-size:24px;margin-bottom:4px}
  .sub{color:#888;font-size:14px;margin-bottom:24px}
  ul{list-style:none;padding:0}
  li{background:#fff;border:1px solid #eee;border-radius:10px;padding:14px 16px;margin-bottom:10px;transition:.15s}
  li:hover{box-shadow:0 2px 12px rgba(0,0,0,.06)}
  a{color:#0969da;text-decoration:none;font-size:16px;font-weight:500}
  a:hover{text-decoration:underline}
  .date{color:#999;font-size:13px;margin-left:8px}
  @media(prefers-color-scheme:dark){body{background:#0d1117;color:#e6edf3}li{background:#161b22;border-color:#30363d}.sub,.date{color:#8b949e}a{color:#58a6ff}}
</style>
</head>
<body>
<h1>🤖 每日 AI 新闻简报</h1>
<div class="sub">每天早 8 点自动更新 · 由 Hermes Agent 生成</div>
<ul id="list"></ul>
<script>
fetch('archive.json').then(r=>r.json()).then(items=>{
  const ul=document.getElementById('list');
  if(!items.length){ul.innerHTML='<li>暂无内容</li>';return}
  items.sort((a,b)=>b.date.localeCompare(a.date));
  ul.innerHTML=items.map(i=>`<li><a href="${i.file}">${i.title}</a><span class="date">${i.date}</span></li>`).join('');
}).catch(()=>{document.getElementById('list').innerHTML='<li>暂无内容</li>'});
</script>
</body>
</html>
